name: Metrics  
on:  
  schedule:  
    - cron: "0 0 * * *" # Schedule daily updates  
  workflow_dispatch: {} # (optional) Run workflow manually  
  push:  
    branches:  
      - master  
      - main # (optional) Run workflow when pushing on master/main  

jobs:  
  github-metrics:  
    runs-on: ubuntu-latest  
    environment:   
      name: production  
    permissions:  
      contents: write  
    steps:  
      - uses: lowlighter/metrics@latest # Consider specifying a fixed version  
        with:  
          token: ${{ secrets.METRICS_TOKEN }}
